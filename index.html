<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced JavaScript To-Do List</title>
    <style>
        :root {
            --bg: #f9fafb;
            --surface: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --primary: #4f46e5;
            --border: #e5e7eb;
        }

        body.theme-dark {
            --bg: #111827;
            --surface: #1f2937;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #6366f1;
            --border: #374151;
        }

        body.theme-ocean {
            --bg: #ecfeff;
            --surface: #ffffff;
            --text: #164e63;
            --text-muted: #0891b2;
            --primary: #06b6d4;
            --border: #cffafe;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
            transition: background 0.2s, color 0.2s;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        select, input, textarea, button {
            font-family: inherit;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface);
            color: var(--text);
        }

        .todo-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            background: var(--surface);
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: flex;
            gap: 0.5rem;
        }

        .form-row input {
            flex: 1;
        }

        textarea {
            resize: vertical;
            min-height: 50px;
        }

        button[type="submit"] {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .filters button,
        .btn-edit,
        .btn-delete {
            cursor: pointer;
        }

        .filters button.active {
            background-color: var(--primary);
            color: white;
        }

        .todo-list {
            list-style: none;
            padding: 0;
        }

        .todo-item {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .title {
            text-decoration: line-through;
        }

        .todo-item.overdue {
            border-color: #ef4444 !important;
            background-color: rgba(239, 68, 68, 0.05);
        }

        .todo-item.overdue .date-badge {
            color: #ef4444 !important;
            font-weight: bold;
        }

        .todo-main {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .todo-main input[type="checkbox"] {
            margin-top: 0.35rem;
        }

        .todo-content {
            flex: 1;
        }

        .title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0.25rem 0;
            white-space: pre-wrap;
        }

        .date-badge {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 0.5rem;
        }

        .btn-edit {
            background-color: #f59e0b;
            color: white;
            border: none;
        }

        .btn-delete {
            background-color: #ef4444;
            color: white;
            border: none;
        }

        @media (max-width: 500px) {
            .header-container,
            .form-row {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>Task Manager</h1>
        <div >
            <label for="theme-select">Theme: </label>
            <select id="theme-select">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="ocean">Ocean</option>
            </select>
        </div>
    </div>

    <form id="todo-form" class="todo-form">
        <div class="form-row">
            <input type="text" id="todo-title" placeholder="Task Title" required>
            <input type="date" id="todo-date" placeholder="Date" required>
        </div>
        <textarea id="todo-desc" placeholder="Task Description (Optional)"></textarea>
        <button type="submit">Add Task</button>
    </form>

    <div class="filters" id="filter-buttons">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <script>
        const validThemes = ['light', 'dark', 'ocean'];

        function loadTodos() {
            try {
                const storedTodos = JSON.parse(localStorage.getItem('todos'));
                return Array.isArray(storedTodos) ? storedTodos : [];
            } catch {
                localStorage.removeItem('todos');
                return [];
            }
        }

        let todos = loadTodos();
        let currentFilter = 'all';
        let currentTheme = localStorage.getItem('todo-theme') || 'light';

        if (!validThemes.includes(currentTheme)) {
            currentTheme = 'light';
        }

        const todoForm = document.getElementById('todo-form');
        const todoTitle = document.getElementById('todo-title');
        const todoDate = document.getElementById('todo-date');
        const todoDesc = document.getElementById('todo-desc');
        const todoList = document.getElementById('todo-list');
        const filterButtons = document.getElementById('filter-buttons');
        const themeSelect = document.getElementById('theme-select');

        function applyTheme(themeName) {
            if (!validThemes.includes(themeName)) {
                themeName = 'light';
            }

            document.body.classList.remove('theme-dark', 'theme-ocean');

            if (themeName !== 'light') {
                document.body.classList.add(`theme-${themeName}`);
            }

            themeSelect.value = themeName;
            localStorage.setItem('todo-theme', themeName);
        }

        function saveToLocalStorage() {
            localStorage.setItem('todos', JSON.stringify(todos));
            render();
        }

        function createId() {
            if (window.crypto && typeof crypto.randomUUID === 'function') {
                return crypto.randomUUID();
            }

            return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        }

        function addTodo(title, date, desc) {
            if (!title || !date) {
                return;
            }

            todos.push({
                id: createId(),
                title,
                date,
                desc,
                completed: false
            });

            saveToLocalStorage();
        }

        function toggleTodo(id) {
            todos = todos.map(todo =>
                String(todo.id) === String(id)
                    ? { ...todo, completed: !todo.completed }
                    : todo
            );

            saveToLocalStorage();
        }

        function deleteTodo(id) {
            todos = todos.filter(todo => String(todo.id) !== String(id));
            saveToLocalStorage();
        }

        function editTodo(id, newTitle, newDesc, newDate) {
            if (!newTitle || !newDate) {
                return;
            }

            todos = todos.map(todo =>
                String(todo.id) === String(id)
                    ? { ...todo, title: newTitle, desc: newDesc, date: newDate }
                    : todo
            );

            saveToLocalStorage();
        }

        function escapeHTML(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getTodayString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');

            return `${year}-${month}-${day}`;
        }

        function render() {
            todoList.innerHTML = '';
            const todayString = getTodayString();

            const filteredTodos = todos.filter(todo => {
                if (currentFilter === 'active') {
                    return !todo.completed;
                }

                if (currentFilter === 'completed') {
                    return todo.completed;
                }

                return true;
            });

            filteredTodos.forEach(todo => {
                const isOverdue =
                    !todo.completed &&
                    typeof todo.date === 'string' &&
                    todo.date < todayString;

                const li = document.createElement('li');
                li.className = 'todo-item';

                if (todo.completed) {
                    li.classList.add('completed');
                }

                if (isOverdue) {
                    li.classList.add('overdue');
                }

                li.dataset.id = todo.id;

                li.innerHTML = `
                    <div class="todo-main">
                        <input
                            type="checkbox"
                            class="toggle-chk"
                            aria-label="Mark task as completed"
                            ${todo.completed ? 'checked' : ''}
                        >
                        <div class="todo-content">
                            <div class="title">${escapeHTML(todo.title)}</div>
                            ${
                                todo.desc
                                    ? `<div class="desc">${escapeHTML(todo.desc)}</div>`
                                    : ''
                            }
                            <div class="date-badge">
                                📅 Due: ${escapeHTML(todo.date || 'No Date')}
                                ${isOverdue ? '⚠️ OVERDUE' : ''}
                            </div>
                        </div>
                    </div>
                    <div class="actions">
                        <button type="button" class="btn-edit">Edit</button>
                        <button type="button" class="btn-delete">Delete</button>
                    </div>
                `;
            

                todoList.appendChild(li);
            });
        }

        themeSelect.addEventListener('change', event => {
            applyTheme(event.target.value);
        });

        filterButtons.addEventListener('click', event => {
            const button = event.target.closest('button[data-filter]');

            if (!button) {
                return;
            }

            currentFilter = button.dataset.filter;

            filterButtons.querySelectorAll('button').forEach(filterButton => {
                filterButton.classList.toggle('active', filterButton === button);
            });

            render();
        });

        todoList.addEventListener('change', event => {
            if (!event.target.classList.contains('toggle-chk')) {
                return;
            }

            const item = event.target.closest('.todo-item');

            if (item) {
                toggleTodo(item.dataset.id);
            }
        });

        todoList.addEventListener('click', event => {
            const item = event.target.closest('.todo-item');

            if (!item) {
                return;
            }

            const id = item.dataset.id;
            const todo = todos.find(currentTodo =>
                String(currentTodo.id) === String(id)
            );

            if (!todo) {
                return;
            }

            if (event.target.classList.contains('btn-delete')) {
                deleteTodo(id);
            }

            if (event.target.classList.contains('btn-edit')) {
                const newTitle = prompt('Task title:', todo.title);

                if (newTitle === null) {
                    return;
                }

                const newDesc = prompt('Task description:', todo.desc || '');

                if (newDesc === null) {
                    return;
                }

                const newDate = prompt('Due date (YYYY-MM-DD):', todo.date);

                if (newDate === null) {
                    return;
                }

                editTodo(
                    id,
                    newTitle.trim(),
                    newDesc.trim(),
                    newDate.trim()
                );
            }
        });

        todoForm.addEventListener('submit', event => {
            event.preventDefault();

            const title = todoTitle.value.trim();
            const date = todoDate.value;
            const desc = todoDesc.value.trim();

            if (!title || !date) {
                return;
            }

            addTodo(title, date, desc);
            todoForm.reset();
        });

        applyTheme(currentTheme);
        render();
    </script>
</body>
</html>
